spring.application.name=sistema_ventas_api
server.port=${PORT:8080}
logging.pattern.dateformat=hh:mm

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# JPA
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION}

## CORS
cors.allowed-origin=${FRONTEND_URL}

# Link publico de facturacion
factusmart.api.url=${FACTUSMART_URL:https://s2.factusmart.pe/api/v1/issuer}